/* ---------- storage (safe if the browser blocks it) ---------- */
function tryStore(kind){ try{ const s = window[kind]; s.setItem("bareq.t","1"); s.removeItem("bareq.t"); return s; }catch(e){ return null; } }
const LS = tryStore("localStorage"), SS = tryStore("sessionStorage");
const mem = {};
const store = {
  get(k, fb, s = LS){ try{ const v = s ? s.getItem(k) : mem[k]; return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v, s = LS){ const j = JSON.stringify(v); try{ s ? s.setItem(k, j) : (mem[k] = j); }catch(e){ mem[k] = j; } },
  del(k, s = LS){ try{ s ? s.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; } },
  clearAll(){ try{ [LS, SS].forEach(s => s && Object.keys(s).filter(k => k.startsWith("bareq.")).forEach(k => s.removeItem(k))); }catch(e){} Object.keys(mem).forEach(k => delete mem[k]); }
};

/* ---------- dates in UAE time ---------- */
function uaeNow(){
  const now = new Date();
  try{
    const parts = new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.TIMEZONE,year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now);
    const p = {}; parts.forEach(x => p[x.type] = x.value);
    return {y:+p.year, m:+p.month, d:+p.day, time:p.hour + ":" + p.minute};
  }catch(e){
    return {y:now.getFullYear(), m:now.getMonth()+1, d:now.getDate(), time:String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0")};
  }
}
function todayText(){
  try{ return new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.TIMEZONE,weekday:"short",day:"numeric",month:"short",year:"numeric"}).format(new Date()); }
  catch(e){ const t = uaeNow(); return t.d + " " + MONTHS[t.m-1] + " " + t.y; }
}
/* The request month is the month the window closes in (28 Nov to 5 Dec = "Dec 2026"). */
function cycleInfo(){
  const t = uaeNow();
  let y = t.y, m = t.m;
  if (t.d > CONFIG.WINDOW_END_DAY){ m++; if (m > 12){ m = 1; y++; } }
  let sm = m - 1; if (sm < 1) sm = 12;
  const sv = state.server || {};
  if (CONFIG.MODE === "live" && sv.windowText){
    return {key: sv.cycleKey || (y + "-" + String(m).padStart(2,"0")), label: sv.cycle || (MONTHS[m-1] + " " + y),
      windowText: sv.windowText, opensText: sv.opensText || sv.windowText, closesText: sv.closesText || sv.windowText, realOpen: !!sv.windowOpen};
  }
  return {
    key: y + "-" + String(m).padStart(2,"0"),
    label: MONTHS[m-1] + " " + y,
    windowText: CONFIG.WINDOW_START_DAY + " " + MONTHS[sm-1] + " – " + CONFIG.WINDOW_END_DAY + " " + MONTHS[m-1],
    opensText: CONFIG.WINDOW_START_DAY + " " + MONTHS[sm-1],
    closesText: CONFIG.WINDOW_END_DAY + " " + MONTHS[m-1],
    realOpen: t.d >= CONFIG.WINDOW_START_DAY || t.d <= CONFIG.WINDOW_END_DAY
  };
}
function isWindowOpen(){
  const ci = cycleInfo();
  if (CONFIG.MODE === "demo") return state.demoWindow === "real" ? ci.realOpen : state.demoWindow === "open";
  return state.server.windowOpen === null ? ci.realOpen : !!state.server.windowOpen;
}

/* How many requests this BA has sent this month, and how many are allowed (0 = no limit) */
function usage(){
  if (!state.ba) return {used:0, limit:1};
  if (CONFIG.MODE === "demo") return {used: demoSubs(state.ba.mobile).length, limit: CONFIG.DEMO_REQUESTS_PER_MONTH};
  const lim = state.server.requestsLimit;
  return {used: +state.server.requestsUsed || (state.server.alreadySubmitted ? 1 : 0), limit: (lim === undefined || lim === null || lim === "") ? 1 : +lim};
}
function alreadySubmitted(){
  if (!state.ba) return false;
  const u = usage();
  if (CONFIG.MODE === "demo") return u.limit > 0 && u.used >= u.limit;
  return !!state.server.alreadySubmitted;
}

/* ---------- talking to Power Automate (live mode) ---------- */
async function postFlow(body){
  if (!CONFIG.FLOW_URL) throw Object.assign(new Error("No flow URL"), {code:"NO_URL"});
  let res;
  try{ res = await fetch(CONFIG.FLOW_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:JSON.stringify(body)}); }
  catch(e){ throw Object.assign(new Error("Network"), {code:"NETWORK"}); }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if (!data) throw Object.assign(new Error("Bad response"), {code:"NETWORK"});
  return data;
}
function applyServer(r){
  state.server = {windowOpen:r.windowOpen, alreadySubmitted:!!r.alreadySubmitted, requestsUsed:r.requestsUsed, requestsLimit:r.requestsLimit,
    windowText:r.windowText || "", opensText:r.opensText || "", closesText:r.closesText || "", cycle:r.cycle || "", cycleKey:r.cycleKey || ""};
  if (Array.isArray(r.products) && r.products.length) setProducts(r.products);
  if (r.startDay) CONFIG.WINDOW_START_DAY = +r.startDay;
  if (r.endDay) CONFIG.WINDOW_END_DAY = +r.endDay;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){
  const w = String(name).replace(/[^A-Za-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
  return ((w[0]||"?")[0] + ((w[1]||"")[0]||"")).toUpperCase();
}
function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
/* Accepts 050 123 4567, +971 50 123 4567, 00971501234567 and returns 0501234567 */
function normMobile(s){
  let d = String(s || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("971")) d = "0" + d.slice(3);
  if (d.length === 9 && d.startsWith("5")) d = "0" + d;
  return d;
}
function maskMobile(m){ return m.length >= 7 ? m.slice(0,3) + " ••• " + m.slice(-4) : m; }

async function doLogin(){
  const L = state.login;
  const mf = document.getElementById("mobile"), pf = document.getElementById("pin");
  if (mf) L.mobile = mf.value; if (pf) L.pin = pf.value;
  const mobile = normMobile(L.mobile), pin = String(L.pin).trim();
  if (mobile.length < 9){ L.error = "Enter your mobile number, for example 050 123 4567."; render(); return; }
  if (!/^\d{4,6}$/.test(pin)){ L.error = "Enter your PIN (4 digits)."; render(); return; }
  L.error = ""; L.busy = true; render();
  try{
    let ba, srv = null;
    if (CONFIG.MODE === "demo"){
      await sleep(500);
      const b = DEMO_BAS.find(x => x.mobile === mobile && x.pin === pin);
      if (!b) throw Object.assign(new Error(), {code:"INVALID_LOGIN"});
      ba = {mobile, pin, name:b.name, store:b.store, retailer:b.retailer || ""};
    } else {
      const r = await postFlow({action:"login", mobile, pin});
      if (!r.ok) throw Object.assign(new Error(), {code:r.error || "INVALID_LOGIN"});
      applyServer(r);
      srv = r;
      ba = {mobile, pin, name:r.baName, store:r.store, retailer:r.retailer || ""};
    }
    store.set("bareq.session", srv ? {...ba, at:Date.now(), server:srv} : ba);
    Object.assign(L, {mobile:"", pin:"", busy:false});
    selectBa(ba);
  }catch(e){
    L.busy = false;
    L.error = {
      INVALID_LOGIN:"Mobile number or PIN is not correct. Please try again.",
      INACTIVE:"Your account is not active. Please contact your manager.",
      NO_URL:"The app is not connected to Power Automate yet.",
      NETWORK:"Can't connect. Check your internet and try again."
    }[e.code] || "Sign in failed. Please try again.";
    render();
  }
}

  const requests = [];
  const add = (ba, reqId, time, stock, tester) => {
    stock.forEach(p => requests.push({requestId:reqId, submittedAt:time, mobile:ba.mobile, baName:ba.name, store:ba.store, retailer:ba.retailer || "", type:"Stock", sku:p.sku, barcode:p.barcode, name:p.name, brand:p.brand || ""}));
    tester.forEach(p => requests.push({requestId:reqId, submittedAt:time, mobile:ba.mobile, baName:ba.name, store:ba.store, retailer:ba.retailer || "", type:"Tester", sku:p.sku, barcode:p.barcode, name:p.name, brand:p.brand || ""}));
  };
  DEMO_SEED.forEach((s, i) => {
    const ba = DEMO_BAS.find(b => b.mobile === s.mobile);
    add(ba, "DEMO-" + (i+1), s.time, s.stock.map(find), s.tester.map(find));
  });
  DEMO_BAS.forEach(ba => {
    demoSubs(ba.mobile).forEach(sub => {
      if (sub && sub.items) add(ba, sub.requestId, sub.submittedAt, sub.items.filter(i => i.type === "Stock"), sub.items.filter(i => i.type === "Tester"));
    });
  });
  return {cycle:ci.label, bas:DEMO_BAS.map(b => ({mobile:b.mobile, name:b.name, store:b.store, retailer:b.retailer || ""})), requests};
}

async function loadAdmin(user, password){
  if (CONFIG.MODE === "demo"){
    await sleep(500);
    if (user.toLowerCase() !== DEMO_ADMIN.user || password !== DEMO_ADMIN.password) throw Object.assign(new Error(), {code:"INVALID_ADMIN"});
    return demoAdminData();
  }
  const r = await postFlow({action:"admin", user, password});
  if (!r.ok) throw Object.assign(new Error(), {code:r.error || "INVALID_ADMIN"});
  if (r.windowText !== undefined || r.windowOpen !== undefined) applyServer(r);
  return {cycle:r.cycle || cycleInfo().label, bas:r.bas || [], requests:r.requests || []};
}

async function doAdminLogin(){
  const A = state.adminForm;
  const uf = document.getElementById("auser"), pf = document.getElementById("apass");
  if (uf) A.user = uf.value; if (pf) A.password = pf.value;
  if (!A.user.trim() || !A.password){ A.error = "Enter your user ID and password."; render(); return; }
  A.error = ""; A.busy = true; render();
  try{
    state.adminData = await loadAdmin(A.user.trim(), A.password);
    state.admin = {user:A.user.trim(), password:A.password};
    store.set("bareq.admin", state.admin, SS);
    Object.assign(A, {user:"", password:"", busy:false});
    state.adminOpen = {};
    go("admin");
  }catch(e){
    A.busy = false;
    A.error = {INVALID_ADMIN:"User ID or password is not correct.", NO_URL:"The app is not connected to Power Automate yet.", NETWORK:"Can't connect. Check your internet and try again."}[e.code] || "Sign in failed. Please try again.";
    render();
  }
}

async function refreshAdmin(){
  if (!state.admin) return;

      </button>
      ${open ? `<ul class="reqitems">${[...r.stock.map(i => ["Stock", i]), ...r.tester.map(i => ["Tester", i])].map(([t, i]) =>
        `<li><span>${esc(i.name)}${i.brand ? `<small style="display:block">${esc(i.brand)}</small>` : ""}</span><small>${t} · ${esc(i.sku)}</small></li>`).join("")}</ul>` : ""}`;
  }).join("") : `<div class="row"><span class="rl muted">No requests yet this month</span></div>`;

  return {
    body: title("Dashboard", esc(D.cycle) + " requests") +
      `<div class="tiles">
        <div class="tile"><b>${sentMobiles.size}<span style="display:inline;font-size:15px;color:var(--label2);font-weight:500"> / ${D.bas.length}</span></b><span>BAs submitted</span><div class="meter"><i style="width:${pct}%"></i></div></div>

        <div class="tile t"><b>${testerN}</b><span>Tester items</span></div>

      group("", st) +
      group(gh("Waiting for", waiting.length),
        waiting.length ? waiting.map(b => `<div class="row ic"><span class="av round">${esc(initials(b.name))}</span><span class="rl"><span class="two"><strong>${esc(b.name)}</strong><small>${b.retailer ? esc(b.retailer) + " · " : ""}${esc(b.store)} · ${esc(b.mobile)}</small></span></span></div>`).join("")
          : `<div class="row"><span class="rl"><span class="dot ok"></span>Everyone has submitted</span></div>`,
        waiting.length ? "BAs who haven't sent a request for this month yet." : "") +

      (top.length ? group("Most requested", top.map((p, i) => `<div class="row"><span class="rank">${i+1}</span><span class="rl"><span class="two"><strong>${esc(p.name)}</strong><small>${p.brand ? esc(p.brand) + " · " : ""}${esc(p.sku)}</small></span></span><span class="pills">${p.s?`<span class="pill s">${p.s} S</span>`:""}${p.t?`<span class="pill t">${p.t} T</span>`:""}</span></div>`).join("")) : "") +

function renderProductList(){
  const box = document.getElementById("plist"), note = document.getElementById("pnote");
  if (!box) return;
  const words = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = PRODUCTS;
  if (state.filter !== "all"){
    const skus = new Set(state.cart[state.filter].map(i => i.sku));
    list = PRODUCTS.filter(p => skus.has(p.sku));
  }
  if (state.brand !== "all") list = list.filter(p => p.brand === state.brand);
  if (words.length) list = list.filter(p => words.every(w => p._hay.includes(w)));
  const shown = list.slice(0, CONFIG.MAX_RESULTS);
  if (!shown.length){
    box.innerHTML = state.filter !== "all" && !words.length && state.brand === "all"
      ? `<div class="emptyrow"><strong>No ${state.filter} products yet</strong><span>Switch to All and tap ${state.filter === "stock" ? "Stock" : "Tester"} on a product.</span></div>`
      : `<div class="emptyrow"><strong>No Results</strong><span>${state.query.trim() ? `Nothing matches "${esc(state.query.trim())}"${state.brand !== "all" ? " in " + esc(state.brand) : ""}. Try the SKU or barcode.` : "No products in this view."}</span></div>`;
    note.textContent = "";
  } else {
    box.innerHTML = shown.map(productRow).join("");
    note.textContent = list.length > shown.length
      ? "Showing " + shown.length + " of " + list.length + ". Type more to narrow the list."
      : plural(list.length, "product");
  }
  const clr = document.querySelector(".clear");
  if (clr) clr.hidden = !state.query;
}

/* ---------- render ---------- */
function render(){
  const active = document.activeElement && document.activeElement.id;
  const caret = (active === "q") ? document.activeElement.selectionStart : null;
  const screens = {login:screenLogin, adminLogin:screenAdminLogin, admin:screenAdmin, details:screenDetails, products:screenProducts, cart:screenCart, review:screenReview, success:screenSuccess, blocked:screenBlocked, loading:screenLoading};
  const needsBa = ["details","products","cart","review","success"];
  if (needsBa.includes(state.step) && !state.ba) state.step = "login";
  if (state.step === "admin" && !state.adminData) state.step = "adminLogin";
  const v = (screens[state.step] || screenLoading)();
  document.getElementById("app").innerHTML =
    `<div class="shell">${nav()}<main>${v.body}</main>${v.bar ? `<div class="bottom">${v.bar}</div>` : ""}</div>${alertBox()}`;
  if (state.step === "products"){ renderProductList(); renderCartBar(); }
  if (active){
    const el = document.getElementById(active);
    if (el){ el.focus({preventScroll:true}); if (caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
  }
}

function go(step){
  if (step !== "review") state.confirmChecked = false;
  if (step === "login") state.login.error = "";
  if (step === "adminLogin") state.adminForm.error = "";
  state.step = step;
  render();
  window.scrollTo(0, 0);
}
function selectBa(ba){
  state.ba = ba; loadCart();
  // Drop any saved cart items for products that were removed from the list
  const live = new Set(PRODUCTS.map(p => p.sku));
  ["stock","tester"].forEach(t => { state.cart[t] = state.cart[t].filter(i => live.has(i.sku)); });
  saveCart();
  state.step = "details"; render(); window.scrollTo(0, 0);
}

async function doSubmit(){
  if (state.submitting) return;
  state.submitting = true; state.submitError = ""; render();
  const ci = cycleInfo();
  const stockCount = state.cart.stock.length, testerCount = state.cart.tester.length;
  const requestId = "REQ-" + state.ba.mobile.slice(-4) + "-" + Date.now().toString(36).toUpperCase();
  const items = [
    ...state.cart.stock.map(i => ({type:"Stock", sku:i.sku, barcode:i.barcode, name:i.name, brand:i.brand || ""})),
    ...state.cart.tester.map(i => ({type:"Tester", sku:i.sku, barcode:i.barcode, name:i.name, brand:i.brand || ""}))
  ];
  try{
    let r;
    if (CONFIG.MODE === "demo"){
      await sleep(900);
      const t = uaeNow();
      r = {submittedAt: todayText() + ", " + t.time, cycle:ci.label, stockCount, testerCount, requestId};
      store.set(demoSubKey(state.ba.mobile), [...demoSubs(state.ba.mobile), {...r, submittedAt: t.d + " " + MONTHS[t.m-1] + ", " + t.time, items}]);
    } else {
      const x = await postFlow({action:"submit", mobile:state.ba.mobile, pin:state.ba.pin, requestId, items});
      if (!x.ok) throw Object.assign(new Error(x.error || "FAILED"), {code:x.error || "FAILED"});
      r = {submittedAt:x.submittedAt || (todayText() + ", " + uaeNow().time), cycle:x.cycle || ci.label, stockCount:x.stockCount ?? stockCount, testerCount:x.testerCount ?? testerCount, requestId:x.requestId || requestId};
      const lim = (x.requestsLimit === undefined) ? 1 : +x.requestsLimit;
      const used = (x.requestsUsed === undefined) ? (usage().used + 1) : +x.requestsUsed;
      state.server.requestsUsed = used; state.server.requestsLimit = lim;
      state.server.alreadySubmitted = lim > 0 && used >= lim;
      const sess = store.get("bareq.session", null);
      if (sess && sess.server){ Object.assign(sess.server, {requestsUsed:used, requestsLimit:lim, alreadySubmitted:state.server.alreadySubmitted}); store.set("bareq.session", sess); }
    }
    state.lastResult = r;
    state.cart = {stock:[], tester:[]}; saveCart();
    state.confirmChecked = false; state.modal = null; state.submitting = false; state.step = "success";
    render(); window.scrollTo(0, 0);
  }catch(e){
    const code = e.code || "NETWORK";
    if (code === "CLOSED") state.server.windowOpen = false;
    if (code === "ALREADY_SUBMITTED") state.server.alreadySubmitted = true;
    if (code === "INVALID_LOGIN" || code === "INACTIVE"){ state.modal = null; state.submitting = false; store.del("bareq.session"); state.ba = null; state.login.error = "Please sign in again."; go("login"); return; }
    state.submitError = {
      CLOSED:"Submissions are closed right now. Your cart is still saved.",
      ALREADY_SUBMITTED:"A request was already sent for this month.",
      NO_URL:"The app is not connected to Power Automate yet."
    }[code] || "Couldn't send. Check your internet and try again. Your cart is still saved.";
    state.submitting = false;
    render();
  }
}

async function recheck(){
  if (!state.ba || state.rechecking) return;
  state.rechecking = true; render();
  try{
    const r = await postFlow({action:"login", mobile:state.ba.mobile, pin:state.ba.pin});
    if (r.ok){
      applyServer(r);
      store.set("bareq.session", {mobile:state.ba.mobile, pin:state.ba.pin, name:r.baName, store:r.store, retailer:r.retailer || "", at:Date.now(), server:r});
    }
  }catch(e){}
  state.rechecking = false; render();
}

/* ---------- start-up: restore a saved sign-in ---------- */
async function resumeSession(){
  const s = store.get("bareq.session", null);
  if (!s || !s.mobile){ state.step = "login"; render(); return; }
  if (CONFIG.MODE === "demo"){
    const b = DEMO_BAS.find(x => x.mobile === s.mobile && x.pin === s.pin);
    if (b) selectBa({mobile:b.mobile, pin:b.pin, name:b.name, store:b.store, retailer:b.retailer || ""});
    else { store.del("bareq.session"); state.step = "login"; render(); }
    return;
  }
  // Opened again within the hour: use the saved details, no need to ask Excel again
  if (s.at && s.server && Date.now() - s.at < 3600000){
    applyServer(s.server);
    selectBa({mobile:s.mobile, pin:s.pin, name:s.name, store:s.store, retailer:s.retailer || ""});
    return;
  }
  state.step = "loading"; render();
  try{
    const r = await postFlow({action:"login", mobile:s.mobile, pin:s.pin});
    if (!r.ok){ store.del("bareq.session"); state.login.error = r.error === "INACTIVE" ? "Your account is not active. Please contact your manager." : "Please sign in again."; state.step = "login"; render(); return; }
    applyServer(r);
    store.set("bareq.session", {mobile:s.mobile, pin:s.pin, name:r.baName, store:r.store, retailer:r.retailer || "", at:Date.now(), server:r});
    selectBa({mobile:s.mobile, pin:s.pin, name:r.baName, store:r.store, retailer:r.retailer || ""});
  }catch(e){
    state.blocked = e.code === "NO_URL" ? "nourl" : "network"; state.step = "blocked"; render();
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "overlay"){ if (e.target === el && !state.submitting){ state.modal = null; state.submitError = ""; render(); } return; }
  if (el.disabled) return;
  switch (a){
    case "login": doLogin(); break;
    case "demo-fill": { const b = DEMO_BAS.find(x => x.mobile === el.dataset.mobile); if (b){ Object.assign(state.login, {mobile:b.mobile, pin:b.pin, error:""}); render(); } break; }
    case "signout": signOut(); break;
    case "admin-login": doAdminLogin(); break;
    case "admin-refresh": refreshAdmin(); break;
    case "admin-signout": adminSignOut(); break;
    case "admin-toggle": state.adminOpen[el.dataset.id] = !state.adminOpen[el.dataset.id]; render(); break;
    case "go": go(el.dataset.step); break;
    case "filter": state.filter = el.dataset.filter; render(); break;
    case "brand": state.brand = el.dataset.brand; render(); { const c = document.querySelector(".chip.on"); if (c) c.scrollIntoView({inline:"center", block:"nearest"}); } break;
    case "clear-search": { state.query = ""; render(); const q = document.getElementById("q"); if (q) q.focus(); break; }
    case "toggle":
      toggleItem(el.dataset.type, el.dataset.sku);
      if (state.step === "products"){ renderProductList(); renderCartBar(); }
      break;
    case "remove": removeItem(el.dataset.type, el.dataset.sku); render(); break;
    case "open-confirm": state.modal = "confirm"; state.submitError = ""; render(); { const y = document.querySelector('.alert-btns [data-action="submit"]'); if (y) y.focus({preventScroll:true}); } break;
    case "cancel-confirm": state.modal = null; state.submitError = ""; render(); break;
    case "submit": doSubmit(); break;
    case "retry": resumeSession(); break;
    case "recheck": recheck(); break;
    case "demo-window": state.demoWindow = el.dataset.val; state.confirmChecked = false; render(); break;
    case "demo-reset":
      store.clearAll();
      Object.assign(state, {ba:null, cart:{stock:[], tester:[]}, query:"", filter:"all", confirmChecked:false, modal:null, demoWindow:"open", admin:null, adminData:null});
      state.login = {mobile:"", pin:"", error:"", busy:false};
      go("login");
      break;
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q"){ state.query = e.target.value; renderProductList(); }
  else if (id === "mobile") state.login.mobile = e.target.value;
  else if (id === "pin") state.login.pin = e.target.value;
  else if (id === "auser") state.adminForm.user = e.target.value;
  else if (id === "apass") state.adminForm.password = e.target.value;
});
document.addEventListener("change", e => { if (e.target.id === "confirm"){ state.confirmChecked = e.target.checked; render(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "loginForm") doLogin();
  if (e.target.id === "adminForm") doAdminLogin();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.modal && !state.submitting){ state.modal = null; state.submitError = ""; render(); }
  if (e.key === "Enter"){
    if (e.target.id === "q") e.target.blur();
    if (e.target.id === "mobile" || e.target.id === "pin"){ e.preventDefault(); doLogin(); }
    if (e.target.id === "auser" || e.target.id === "apass"){ e.preventDefault(); doAdminLogin(); }
  }
});

(function boot(){
  const a = store.get("bareq.admin", null, SS);
  if (a && a.user){
    state.admin = a;
    loadAdmin(a.user, a.password).then(d => { state.adminData = d; go("admin"); }).catch(() => { store.del("bareq.admin", SS); state.admin = null; resumeSession(); });
    return;
  }
  resumeSession();
})();
</script>
